<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title desc"><title id="title">把听歌偏好变成歌单（原创示意）</title><desc id="desc">不要求用户从空白开始设置：已有偏好，给出选项，确认生成。给出有依据的默认选项，由用户决定是否采用</desc><rect width="800" height="440" rx="20" fill="#FBFAF8" /><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="37" y="47" fill="#2D755C" font-size="15" font-weight="700">02   /   交互流程示意</text><text x="37" y="97" fill="#1C2129" font-size="32" font-weight="700">把听歌偏好变成歌单</text><text x="37" y="130" fill="#525862" font-size="17" font-weight="400">不要求用户从空白开始设置</text><rect x="37" y="177" width="225" height="162" rx="15" fill="#FFFFFF" stroke="#D9DCDF" stroke-opacity="1"/><circle cx="76" cy="217" r="21" fill="#E8F4ED" /><g transform="translate(56 197)" stroke="#2D755C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 17v6m6-11v16m6-22v28m6-22v16m6-11v6"/></g><text x="55" y="262" fill="#2D755C" font-size="14" font-weight="700">已有偏好</text><text x="55" y="288" fill="#1C2129" font-size="19" font-weight="700">常听曲风</text><text x="55" y="315" fill="#525862" font-size="14" font-weight="400">系统已有收听偏好</text><path d="M267 258h14m-5-5 5 5-5 5" stroke="#747A83" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="288" y="177" width="225" height="162" rx="15" fill="#E8F4ED" stroke="#2D755C" stroke-opacity="0.55"/><circle cx="327" cy="217" r="21" fill="#FFFFFF" /><g transform="translate(307 197)" stroke="#2D755C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7c0 8-5 13-13 13 8 0 13 5 13 13 0-8 5-13 13-13-8 0-13-5-13-13Z"/></g><text x="306" y="262" fill="#2D755C" font-size="14" font-weight="700">给出选项</text><text x="306" y="288" fill="#1C2129" font-size="19" font-weight="700">推荐新歌单</text><text x="306" y="315" fill="#525862" font-size="14" font-weight="400">询问是否生成歌单</text><path d="M518 258h14m-5-5 5 5-5 5" stroke="#747A83" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="539" y="177" width="225" height="162" rx="15" fill="#FFFFFF" stroke="#D9DCDF" stroke-opacity="1"/><circle cx="578" cy="217" r="21" fill="#E8F4ED" /><g transform="translate(558 197)" stroke="#2D755C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m17 13 10 7-10 7z"/><circle cx="20" cy="20" r="15"/></g><text x="557" y="262" fill="#2D755C" font-size="14" font-weight="700">确认生成</text><text x="557" y="288" fill="#1C2129" font-size="19" font-weight="700">一键生成混合歌单</text><text x="557" y="315" fill="#525862" font-size="14" font-weight="400">继续听或返回</text><path d="M37 366h726" stroke="#D9DCDF"/><text x="37" y="399" fill="#424850" font-size="15" font-weight="400">给出有依据的默认选项，由用户决定是否采用</text><text x="649" y="399" fill="#5A626D" font-size="14" font-weight="400">非原始截图</text></g></svg>