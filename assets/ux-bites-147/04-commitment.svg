<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title desc"><title id="title">先完成一课，再恢复访问（原创示意）</title><desc id="desc">前提是用户明确选择这条限制：自愿设置，学习任务，恢复访问。清楚告诉用户限制何时解除，并保留控制权</desc><rect width="800" height="440" rx="20" fill="#FBFAF8" /><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="37" y="47" fill="#79538A" font-size="15" font-weight="700">04   /   交互流程示意</text><text x="37" y="97" fill="#1C2129" font-size="32" font-weight="700">先完成一课，再恢复访问</text><text x="37" y="130" fill="#525862" font-size="17" font-weight="400">前提是用户明确选择这条限制</text><rect x="37" y="177" width="225" height="162" rx="15" fill="#FFFFFF" stroke="#D9DCDF" stroke-opacity="1"/><circle cx="76" cy="217" r="21" fill="#F3EDF8" /><g transform="translate(56 197)" stroke="#79538A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="13" width="28" height="14" rx="7"/><circle cx="26" cy="20" r="3"/></g><text x="55" y="262" fill="#79538A" font-size="14" font-weight="700">自愿设置</text><text x="55" y="288" fill="#1C2129" font-size="19" font-weight="700">启用约束</text><text x="55" y="315" fill="#525862" font-size="14" font-weight="400">选定要暂时限制的应用</text><path d="M267 258h14m-5-5 5 5-5 5" stroke="#747A83" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="288" y="177" width="225" height="162" rx="15" fill="#F3EDF8" stroke="#79538A" stroke-opacity="0.55"/><circle cx="327" cy="217" r="21" fill="#FFFFFF" /><g transform="translate(307 197)" stroke="#79538A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10c6-2 10-2 13 1v18c-3-3-7-3-13-1zM33 10c-6-2-10-2-13 1v18c3-3 7-3 13-1z"/></g><text x="306" y="262" fill="#79538A" font-size="14" font-weight="700">学习任务</text><text x="306" y="288" fill="#1C2129" font-size="19" font-weight="700">学习一课</text><text x="306" y="315" fill="#525862" font-size="14" font-weight="400">完成今天的课程</text><path d="M518 258h14m-5-5 5 5-5 5" stroke="#747A83" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="539" y="177" width="225" height="162" rx="15" fill="#FFFFFF" stroke="#D9DCDF" stroke-opacity="1"/><circle cx="578" cy="217" r="21" fill="#F3EDF8" /><g transform="translate(558 197)" stroke="#79538A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="17" width="20" height="15" rx="3"/><path d="M15 17v-5a5 5 0 0 1 9-3m-4 14v3"/></g><text x="557" y="262" fill="#79538A" font-size="14" font-weight="700">恢复访问</text><text x="557" y="288" fill="#1C2129" font-size="19" font-weight="700">解除所选限制</text><text x="557" y="315" fill="#525862" font-size="14" font-weight="400">回到原应用</text><path d="M37 366h726" stroke="#D9DCDF"/><text x="37" y="399" fill="#424850" font-size="15" font-weight="400">清楚告诉用户限制何时解除，并保留控制权</text><text x="649" y="399" fill="#5A626D" font-size="14" font-weight="400">非原始截图</text></g></svg>