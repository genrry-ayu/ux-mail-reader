<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title desc"><title id="title">按访问来源提供试读（原创示意）</title><desc id="desc">来自社区的访问，直接看到可使用的权益：来源识别，文章入口，开始阅读。先解释本次权益，再让用户决定下一步</desc><rect width="800" height="440" rx="20" fill="#FBFAF8" /><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="37" y="47" fill="#A62F45" font-size="15" font-weight="700">01   /   交互流程示意</text><text x="37" y="97" fill="#1C2129" font-size="32" font-weight="700">按访问来源提供试读</text><text x="37" y="130" fill="#525862" font-size="17" font-weight="400">来自社区的访问，直接看到可使用的权益</text><rect x="37" y="177" width="225" height="162" rx="15" fill="#FFFFFF" stroke="#D9DCDF" stroke-opacity="1"/><circle cx="76" cy="217" r="21" fill="#F8ECF0" /><g transform="translate(56 197)" stroke="#A62F45" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11 4-4a5 5 0 017 7l-6 6a5 5 0 01-7 0m0 5-4 4a5 5 0 01-7-7l6-6a5 5 0 017 0m-5 6 8-8"/></g><text x="55" y="262" fill="#A62F45" font-size="14" font-weight="700">来源识别</text><text x="55" y="288" fill="#1C2129" font-size="19" font-weight="700">社区链接</text><text x="55" y="315" fill="#525862" font-size="14" font-weight="400">从社区打开文章</text><path d="M267 258h14m-5-5 5 5-5 5" stroke="#747A83" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="288" y="177" width="225" height="162" rx="15" fill="#F8ECF0" stroke="#A62F45" stroke-opacity="0.55"/><circle cx="327" cy="217" r="21" fill="#FFFFFF" /><g transform="translate(307 197)" stroke="#A62F45" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10c6-2 10-2 13 1v18c-3-3-7-3-13-1zM33 10c-6-2-10-2-13 1v18c3-3 7-3 13-1z"/></g><text x="306" y="262" fill="#A62F45" font-size="14" font-weight="700">文章入口</text><text x="306" y="288" fill="#1C2129" font-size="19" font-weight="700">显示权益</text><text x="306" y="315" fill="#525862" font-size="14" font-weight="400">提示本次可试读</text><path d="M518 258h14m-5-5 5 5-5 5" stroke="#747A83" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="539" y="177" width="225" height="162" rx="15" fill="#FFFFFF" stroke="#D9DCDF" stroke-opacity="1"/><circle cx="578" cy="217" r="21" fill="#F8ECF0" /><g transform="translate(558 197)" stroke="#A62F45" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m11 20 6 6 12-13"/><circle cx="20" cy="20" r="15"/></g><text x="557" y="262" fill="#A62F45" font-size="14" font-weight="700">开始阅读</text><text x="557" y="288" fill="#1C2129" font-size="19" font-weight="700">可读 7 篇</text><text x="557" y="315" fill="#525862" font-size="14" font-weight="400">从当前文章开始</text><path d="M37 366h726" stroke="#D9DCDF"/><text x="37" y="399" fill="#424850" font-size="15" font-weight="400">先解释本次权益，再让用户决定下一步</text><text x="649" y="399" fill="#5A626D" font-size="14" font-weight="400">非原始截图</text></g></svg>