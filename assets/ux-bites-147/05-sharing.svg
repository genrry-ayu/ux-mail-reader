<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title desc"><title id="title">把视频中的人放在前面（原创示意）</title><desc id="desc">用视频的真实关联缩短分享路径：视频上下文，分享面板，选择收件人。优先排序是建议，不是替用户发送</desc><rect width="800" height="440" rx="20" fill="#FBFAF8" /><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="37" y="47" fill="#8A5B2D" font-size="15" font-weight="700">05   /   交互流程示意</text><text x="37" y="97" fill="#1C2129" font-size="32" font-weight="700">把视频中的人放在前面</text><text x="37" y="130" fill="#525862" font-size="17" font-weight="400">用视频的真实关联缩短分享路径</text><rect x="37" y="177" width="225" height="162" rx="15" fill="#FFFFFF" stroke="#D9DCDF" stroke-opacity="1"/><circle cx="76" cy="217" r="21" fill="#F7F0E7" /><g transform="translate(56 197)" stroke="#8A5B2D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="14" r="5"/><path d="M10 31c0-6 4-10 10-10s10 4 10 10"/></g><text x="55" y="262" fill="#8A5B2D" font-size="14" font-weight="700">视频上下文</text><text x="55" y="288" fill="#1C2129" font-size="19" font-weight="700">视频中有参与者</text><text x="55" y="315" fill="#525862" font-size="14" font-weight="400">记录谁参与了内容</text><path d="M267 258h14m-5-5 5 5-5 5" stroke="#747A83" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="288" y="177" width="225" height="162" rx="15" fill="#F7F0E7" stroke="#8A5B2D" stroke-opacity="0.55"/><circle cx="327" cy="217" r="21" fill="#FFFFFF" /><g transform="translate(307 197)" stroke="#8A5B2D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="20" r="4"/><circle cx="28" cy="10" r="4"/><circle cx="28" cy="30" r="4"/><path d="m14 18 10-6m-10 10 10 6"/></g><text x="306" y="262" fill="#8A5B2D" font-size="14" font-weight="700">分享面板</text><text x="306" y="288" fill="#1C2129" font-size="19" font-weight="700">推荐收件人</text><text x="306" y="315" fill="#525862" font-size="14" font-weight="400">优先显示参与者</text><path d="M518 258h14m-5-5 5 5-5 5" stroke="#747A83" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="539" y="177" width="225" height="162" rx="15" fill="#FFFFFF" stroke="#D9DCDF" stroke-opacity="1"/><circle cx="578" cy="217" r="21" fill="#F7F0E7" /><g transform="translate(558 197)" stroke="#8A5B2D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m11 20 6 6 12-13"/><circle cx="20" cy="20" r="15"/></g><text x="557" y="262" fill="#8A5B2D" font-size="14" font-weight="700">选择收件人</text><text x="557" y="288" fill="#1C2129" font-size="19" font-weight="700">仍可选择其他人</text><text x="557" y="315" fill="#525862" font-size="14" font-weight="400">确认后再发送</text><path d="M37 366h726" stroke="#D9DCDF"/><text x="37" y="399" fill="#424850" font-size="15" font-weight="400">优先排序是建议，不是替用户发送</text><text x="649" y="399" fill="#5A626D" font-size="14" font-weight="400">非原始截图</text></g></svg>