<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title desc"><title id="title">从登机牌启动专注（原创示意）</title><desc id="desc">用一个明确动作解释计时何时开始：选择时长，开始动作，专注中。隐喻对应真实结果，同时保留易用的启动方式</desc><rect width="800" height="440" rx="20" fill="#FBFAF8" /><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="37" y="47" fill="#315EA8" font-size="15" font-weight="700">03   /   交互流程示意</text><text x="37" y="97" fill="#1C2129" font-size="32" font-weight="700">从登机牌启动专注</text><text x="37" y="130" fill="#525862" font-size="17" font-weight="400">用一个明确动作解释计时何时开始</text><rect x="37" y="177" width="225" height="162" rx="15" fill="#FFFFFF" stroke="#D9DCDF" stroke-opacity="1"/><circle cx="76" cy="217" r="21" fill="#ECF2FC" /><g transform="translate(56 197)" stroke="#315EA8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="14"/><path d="M20 11v10h7"/></g><text x="55" y="262" fill="#315EA8" font-size="14" font-weight="700">选择时长</text><text x="55" y="288" fill="#1C2129" font-size="19" font-weight="700">60 分钟</text><text x="55" y="315" fill="#525862" font-size="14" font-weight="400">把计时映射为航程</text><path d="M267 258h14m-5-5 5 5-5 5" stroke="#747A83" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="288" y="177" width="225" height="162" rx="15" fill="#ECF2FC" stroke="#315EA8" stroke-opacity="0.55"/><circle cx="327" cy="217" r="21" fill="#FFFFFF" /><g transform="translate(307 197)" stroke="#315EA8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11h26v6a3 3 0 0 0 0 6v6H7v-6a3 3 0 0 0 0-6zM23 12v3m0 4v3m0 4v2"/></g><text x="306" y="262" fill="#315EA8" font-size="14" font-weight="700">开始动作</text><text x="306" y="288" fill="#1C2129" font-size="19" font-weight="700">划过登机牌</text><text x="306" y="315" fill="#525862" font-size="14" font-weight="400">手势触发开始</text><path d="M518 258h14m-5-5 5 5-5 5" stroke="#747A83" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="539" y="177" width="225" height="162" rx="15" fill="#FFFFFF" stroke="#D9DCDF" stroke-opacity="1"/><circle cx="578" cy="217" r="21" fill="#ECF2FC" /><g transform="translate(558 197)" stroke="#315EA8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 25-8-8 25-6-11-11-6Zm11 6L32 7"/></g><text x="557" y="262" fill="#315EA8" font-size="14" font-weight="700">专注中</text><text x="557" y="288" fill="#1C2129" font-size="19" font-weight="700">进入 60 分钟计时</text><text x="557" y="315" fill="#525862" font-size="14" font-weight="400">看见计时已启动</text><path d="M37 366h726" stroke="#D9DCDF"/><text x="37" y="399" fill="#424850" font-size="15" font-weight="400">隐喻对应真实结果，同时保留易用的启动方式</text><text x="649" y="399" fill="#5A626D" font-size="14" font-weight="400">非原始截图</text></g></svg>